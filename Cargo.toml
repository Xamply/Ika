[package]
name = "ika-wgpu-wallpaper-bridge"
version = "1.6.0"
edition = "2024"
exclude = ["/scratch", "/target", "/media"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
base64 = "0.22"
ed25519-dalek = "2"
egui = "0.34.3"
egui-wgpu = { version = "0.34.3", default-features = false }
egui-winit = { version = "0.34.3", default-features = false }
font8x8 = "0.3"
lz4_flex = "0.13"
pollster = "0.4"
png = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "ico"] }
md-5 = "0.10"
rayon = "1.10"
regex = "1.11"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
rsa = "0.9"
rand = "0.8"
rusty-leveldb = "4"
tempfile = "3"
ureq = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
wgpu = { version = "29.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
winit = "0.30.13"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_Compression", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-numerics = "0.3.1"

[build-dependencies]
naga = { version = "=29.0.4", features = ["wgsl-in", "hlsl-out"] }
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D_Fxc"] }
